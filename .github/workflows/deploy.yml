name: Pubblica Blobbino

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se hai caricato uno zip dal telefono, lo estrae nel repository e lo cancella.
      - name: Estrai lo zip caricato
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            git rm -q --ignore-unmatch sw.js icon-192.png icon-512.png apple-touch-icon.png manifest.webmanifest .nojekyll
            unzip -oq "$ZIP" -d .
            git rm -q "$ZIP"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Estrae $ZIP"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - name: Controllo dei tipi (non blocca la pubblicazione)
        run: npm run typecheck
        continue-on-error: true
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
